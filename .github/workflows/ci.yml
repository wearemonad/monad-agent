name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Electrobun's toolchain and the app's native deps are macOS arm64 only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install (root — Biome)
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Install (app)
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: app
        run: bun run typecheck
      - name: Test
        working-directory: app
        run: bun test src
